[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-lab"
version = "0.1.0"
description = "Learn RAG with remote PostgreSQL/OpenSearch and local Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langfuse>=5,<6",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
notebook = [
  "jupyterlab>=4.3,<5",
  "ipykernel>=6.29,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "nbconvert>=7.16,<8",
]

[project.scripts]
rag = "rag_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache", ".uv-cache-*", ".notebook-runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
